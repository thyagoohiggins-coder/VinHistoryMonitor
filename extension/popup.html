<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Historico de VIN</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-scroll">
      <div class="top-row">
        <div class="brand-card">
          <span class="brand-title">Reparo FA</span>
          <span class="brand-sub">Controle de VINs</span>
        </div>
        <button id="openSettingsBtn" class="icon-btn" type="button" title="Configuracoes" aria-label="Configuracoes">&#9881;</button>
      </div>

      <section class="actions">
        <button id="openListBtn" type="button">Ver lista de VINs</button>
        <button id="copyDayBtn" class="copy-all-btn" type="button">Copiar todos os VINs do dia</button>
      </section>

      <input id="vinSearch" class="vin-search" type="search" placeholder="Buscar VIN..." autocomplete="off" />

      <button id="toggleSummaryBtn" class="link-toggle" type="button">Mostrar resumo</button>
      <div id="summary" class="summary hidden">
        <div class="stats">
          <span id="countNumber" class="count-number">0</span>
          <span id="countLabel" class="count-label">VINs registrados</span>
        </div>
        <h2 class="section-title">VINs por turno</h2>
        <ul id="shiftCounts" class="shift-counts"></ul>
      </div>

      <ul id="historyList" class="history-list"></ul>
      <p id="noMatch" class="empty-state" style="display: none">Nenhum VIN encontrado.</p>

      <p id="emptyState" class="empty-state">
        Nenhum VIN registrado ainda. Preencha o campo VIN no formulario para comecar.
      </p>
    </div>


    <script src="storage.js"></script>
    <script src="repairs.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
