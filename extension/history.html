<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Lista de VINs</title>
    <link rel="stylesheet" href="history.css" />
  </head>
  <body>
    <header class="page-header">
      <div class="brand-card">
        <span class="brand-title">Reparo FA</span>
        <span class="brand-sub">Controle de VINs</span>
      </div>
      <h1>Lista de VINs</h1>
      <div class="header-actions">
        <span id="totalCount" class="total-count"></span>
        <span id="dupeCount" class="dupe-count"></span>
        <button id="dedupeNowBtn" class="warn-btn">Remover duplicatas</button>
        <button id="clearAllBtn" class="danger-btn">Apagar lista</button>
      </div>
    </header>

    <p id="purgeInfo" class="purge-info"></p>

    <section class="shift-summary">
      <h2 class="section-title">VINs por turno</h2>
      <ul id="shiftCounts" class="shift-counts"></ul>
      <p class="shift-hint">
        Os horarios de cada turno sao definidos no popup da extensao.
      </p>
    </section>

    <div class="toolbar">
      <input id="searchInput" type="search" placeholder="Buscar VIN..." autocomplete="off" />
    </div>

    <div id="listContainer"></div>

    <script src="storage.js"></script>
    <script src="history.js"></script>
  </body>
</html>
