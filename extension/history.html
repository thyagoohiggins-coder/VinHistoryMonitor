<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Lista de VINs</title>
    <link rel="stylesheet" href="history.css" />
  </head>
  <body>
    <header class="page-header">
      <div class="brand-card">
        <span class="brand-title">Reparo FA</span>
        <span class="brand-sub">Controle de VINs</span>
      </div>
      <h1>Lista de VINs</h1>
      <div class="header-actions">
        <span id="totalCount" class="total-count"></span>
        <span id="dupeCount" class="dupe-count"></span>
        <nav class="page-nav">
          <a href="history.html" class="current">Lista de VINs</a>
          <a href="stats.html">Indicadores</a>
          <a href="settings.html">Configuracoes</a>
        </nav>
      </div>
    </header>

    <p id="purgeInfo" class="purge-info"></p>

    <section class="shift-summary">
      <h2 class="section-title">VINs por turno</h2>
      <ul id="shiftCounts" class="shift-counts"></ul>
    </section>

    <div class="toolbar filters">
      <input id="searchInput" type="search" placeholder="Buscar VIN..." autocomplete="off" />
      <select id="modelFilter" title="Modelo">
        <option value="">Todos os modelos</option>
      </select>
      <select id="colorFilter" title="Cor">
        <option value="">Todas as cores</option>
      </select>
      <label class="time-filter">
        De <input id="timeFrom" type="time" />
      </label>
      <label class="time-filter">
        ate <input id="timeTo" type="time" />
      </label>
      <input id="repairFilter" type="search" placeholder="Reparo..." autocomplete="off" />
      <button id="clearFilters" type="button" class="clear-filters">Limpar filtros</button>
      <button id="copyFilteredBtn" type="button" class="entry-btn entry-btn-copy copy-filtered">Copiar VINs filtrados</button>
      <span id="filterCount" class="filter-count"></span>
    </div>

    <div id="listContainer"></div>

    <div class="signature">Hikins</div>

    <script src="storage.js"></script>
    <script src="history.js"></script>
  </body>
</html>
