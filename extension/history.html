<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Calendario de VINs</title>
    <link rel="stylesheet" href="history.css" />
  </head>
  <body>
    <header class="page-header">
      <h1>Calendario de VINs</h1>
      <div class="header-actions">
        <span id="totalCount" class="total-count"></span>
        <button id="clearAllBtn" class="danger-btn">Apagar historico geral</button>
      </div>
    </header>

    <p class="legend">
      <span class="legend-item"><span class="dot has-data"></span> dia com VIN registrado</span>
      <span class="legend-item"><span class="dot has-duplicate"></span> dia com VIN duplicado</span>
    </p>

    <div id="calendarContainer" class="calendar-container"></div>

    <p id="emptyYearsMsg" class="empty-years-msg"></p>

    <aside id="dayPanel" class="day-panel hidden">
      <div class="day-panel-header">
        <h2 id="dayPanelTitle"></h2>
        <button id="closeDayPanel" class="link-btn">Fechar</button>
      </div>
      <ul id="dayPanelList" class="day-panel-list"></ul>
      <button id="deleteDayPanelBtn" class="danger-btn">Apagar VINs deste dia</button>
    </aside>

    <script src="storage.js"></script>
    <script src="history.js"></script>
  </body>
</html>
